# Track C5 — reproduces a genuine CL.TE front-end/back-end disagreement.
#
# The vulnerability isn't anything unusual in this proxy_pass block itself —
# it's what's *missing*: nothing here rejects a client request that supplies
# both Content-Length and Transfer-Encoding. nginx builds ~1.21 and later
# reject that combination by default (before ever reaching this config);
# nginx:1.18 (pinned below via docker-compose.yml) predates that hardening
# and accepts it, exactly like a real, not-yet-patched deployment would.
#
# What happens next needs no special backend logic at all: nginx (as the
# client-facing HTTP/1.1 parser) honors Content-Length=4 for request
# framing, consumes only the first 4 bytes of the chunked-shaped body
# ("0\r\n\r\n" is 5 bytes — the trailing "\n" is left over), and treats
# everything after that — the attacker's smuggled second request — as a
# perfectly ordinary *second*, pipelined request on the same client
# connection. nginx forwards it to the backend and relays the backend's
# second response back to the client, same as it would for any two
# legitimately pipelined requests. See nginx-safe.conf for the fix: reject
# the ambiguous request before any of this can happen.
server {
    listen 80;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # Keep the connection to the backend alive too (not required for the
        # smuggling effect itself — that already happens on the client-facing
        # side above — but it's the realistic, common config shape and keeps
        # the two nginx variants structurally identical apart from the one
        # thing that matters: the ambiguous-framing rejection in the safe one.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}

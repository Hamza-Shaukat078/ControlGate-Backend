# Track C5 — the actual recommended-safe nginx setting: reject any request
# that carries both Content-Length and Transfer-Encoding outright, before it
# ever reaches proxy_pass. This is what current nginx (~1.21.1+) does by
# default; the map+if below reproduces the same rejection explicitly and
# version-independently, so this config is the safe one *because of what it
# configures*, not because of which nginx build it happens to run on —
# nginx-vulnerable.conf runs the identical proxy_pass block, on the identical
# pinned 1.18 image, and differs only by not having this guard.
#
# $http_transfer_encoding and $http_content_length are both "" when their
# header is absent, "" otherwise nonempty — concatenating them with a ":"
# separator and matching "~^.+:.+$" (something, then a colon, then
# something) is true exactly when *both* are present, which is the only
# combination that's genuinely ambiguous (either header alone is fine).
map "$http_transfer_encoding:$http_content_length" $ambiguous_framing {
    default 0;
    "~^.+:.+$" 1;
}

server {
    listen 80;

    # Deliberately at server level, not nested inside `location` — an `if`
    # combined with other directives (root, proxy_pass, ...) inside the same
    # location block is a well-known nginx footgun ("if is evil"); a
    # standalone `return` at server level has none of those interaction
    # problems and is the documented-safe way to write this check.
    if ($ambiguous_framing) {
        return 400;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
